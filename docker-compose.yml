services:
  api:
    container_name: quantum-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: packages/api/Dockerfile

    ports:
      - "${SERVER_PORT:-7080}:${SERVER_PORT:-7080}"

    environment:
      DOMAIN: ${DOMAIN:-http://localhost:${SERVER_PORT:-7080}}
      CLIENT_HOST: ${CLIENT_HOST:-http://localhost:${CLIENT_WEB_APP_PORT:-5050}}
      SERVER_PORT: ${SERVER_PORT:-7080}
      CORS_ORIGIN: ${CORS_ORIGIN:-${CLIENT_HOST:-http://localhost:${CLIENT_WEB_APP_PORT:-5050}}}

      SECRET_KEY: ${SECRET_KEY:?run scripts/deploy.sh, or set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run scripts/deploy.sh, or set ENCRYPTION_KEY in .env}

      DATABASE_URL: postgresql://${POSTGRES_USER:-quantum}:${POSTGRES_PASSWORD:?run scripts/deploy.sh, or set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-quantum}

      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-${DOMAIN:-http://localhost:${SERVER_PORT:-7080}}}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_AUTH_USER: ${SMTP_AUTH_USER:-}
      SMTP_AUTH_PASSWORD: ${SMTP_AUTH_PASSWORD:-}
      WEBMASTER_MAIL: ${WEBMASTER_MAIL:-}

      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_EXPIRATION_DAYS: ${JWT_EXPIRATION_DAYS:-7}
      REGISTRATION_DISABLED: ${REGISTRATION_DISABLED:-false}
      DOCKER_APK_STARTER_PACKAGES: ${DOCKER_APK_STARTER_PACKAGES:-git nodejs npm python3 py3-pip}

      BASE_DOMAIN: ${BASE_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      INGRESS_ENABLED: ${INGRESS_ENABLED:-true}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/quantum:/var/lib/quantum
      - traefik_logs:/logs:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${SERVER_PORT:-7080}/server/health').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - quantum_network
      - quantum_edge

  web:
    container_name: quantum-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_SERVER: ${VITE_SERVER:-${DOMAIN:-http://localhost:${SERVER_PORT:-7080}}}
        VITE_API_SUFFIX: ${VITE_API_SUFFIX:-}

    ports:
      - "${CLIENT_WEB_APP_PORT:-5050}:80"

    depends_on:
      api:
        condition: service_started

    networks:
      - quantum_network

  postgres:
    container_name: quantum-postgres
    image: postgres:18-alpine
    restart: unless-stopped

    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/deploy.sh, or set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quantum}

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - quantum_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantum} -d ${POSTGRES_DB:-quantum}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  traefik:
    container_name: quantum-traefik
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      # Routes that cannot be container labels — anything this platform did not deploy —
      # are written here by the api and picked up without restarting the proxy.
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filepath=/logs/access.log
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Referer=keep

    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/quantum/ingress:/dynamic:ro
      - traefik_acme:/acme
      - traefik_logs:/logs

    networks:
      - quantum_network
      - quantum_edge

networks:
  quantum_network:
    driver: bridge

  quantum_edge:
    name: quantum-edge-${NODE_ENV:-production}
    driver: bridge
    attachable: true

volumes:
  postgres_data:
  traefik_acme:
  traefik_logs:
